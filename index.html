<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var protoDesc =
            typeof Window !== 'undefined' && Window.prototype
              ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
              : null;
          var desc = ownDesc || protoDesc;
          if (desc && desc.get && !desc.set && (!ownDesc || ownDesc.configurable)) {
            var nativeFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return nativeFetch;
              },
              set: function () {},
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            var msg = (event && event.message) || '';
            var src = (event && event.filename) || '';
            if (
              src.indexOf('chrome-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch of #<Window>') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
    <title>SRC CCE Analytics — Dealership Enquiry & CRM Reporting</title>
